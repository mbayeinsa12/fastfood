<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Planificateur de repas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-light">
  <div class="container mt-4">

    <h2 class="text-center mb-4 text-primary">🍽️ Planificateur de repas de la semaine</h2>

    <!-- Zone utilisateur -->
    <div class="card p-3 mb-4">
      <label><strong>Entrez votre prénom :</strong></label>
      <input type="text" id="username" class="form-control mb-2" placeholder="Ex: Aïssatou, Mamadou">
      <button class="btn btn-primary" onclick="loadUser()">✅ Charger mon planning</button>
    </div>

    <!-- Zone de planification -->
    <div id="meal-planner" class="card p-4 shadow-sm bg-white mb-4"></div>

    <!-- Boutons -->
    <div class="d-flex flex-wrap gap-2 mb-4">
      <button class="btn btn-danger" id="resetBtn">🔁 Réinitialiser</button>
      <button class="btn btn-success" onclick="window.print()">🖨️ Imprimer</button>
      <button class="btn btn-primary" onclick="sendByEmail()">📧 Envoyer Email</button>
      <button class="btn btn-success" onclick="sendWhatsApp()">💬 Envoyer WhatsApp</button>
      <button class="btn btn-secondary" onclick="generateLink()">🔗 Générer Lien</button>
      <button class="btn btn-dark" onclick="generateQRCode()">📸 QR Code</button>
    </div>

    <!-- Résumé -->
    <div class="card p-3 shadow-sm bg-white mb-4">
      <h5 class="text-secondary mb-3">📅 Récapitulatif</h5>
      <ul id="summary" class="list-group"></ul>
    </div>

    <!-- Lien + QR -->
    <div id="share-link"></div>
    <div id="qrcode" class="mt-3"></div>

    <!-- Form email caché -->
    <form id="emailForm" action="https://formspree.io/f/YOUR_ID" method="POST" class="d-none">
      <input type="hidden" name="message" id="emailMessage" />
      <button type="submit" id="realSubmitBtn">Envoyer</button>
    </form>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/qrcodejs/qrcode.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
