#######################################
# CONFIGURATION DE LA BASE DE DONNEES #
#######################################
spring.datasource.url=jdbc:mysql://localhost:3306/todo_isep
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.format_sql=true
spring.jpa.show-sql=true


######################
# CONFIGURATION CORS #
######################
spring.web.cors.allowed-origins="http://localhost:4200"
spring.web.cors.allowed-methods=GET, POST, PATCH, PUT, DELETE, OPTIONS, HEAD
spring.web.cors.max-age=3600
spring.web.cors.allowed-headers="Requestor-Type"
spring.web.cors.exposed-headers="X-Get-Header"


